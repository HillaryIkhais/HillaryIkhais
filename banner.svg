<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#0ea5e9;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9d1d9" />
      <stop offset="50%" style="stop-color:#f0f6fc" />
      <stop offset="100%" style="stop-color:#c9d1d9" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed" />
      <stop offset="100%" style="stop-color:#0ea5e9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="8"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#c9d1d9" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="200"/>
    <line x1="45" y1="0" x2="45" y2="200"/>
    <line x1="90" y1="0" x2="90" y2="200"/>
    <line x1="135" y1="0" x2="135" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="225" y1="0" x2="225" y2="200"/>
    <line x1="270" y1="0" x2="270" y2="200"/>
    <line x1="315" y1="0" x2="315" y2="200"/>
    <line x1="360" y1="0" x2="360" y2="200"/>
    <line x1="405" y1="0" x2="405" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="495" y1="0" x2="495" y2="200"/>
    <line x1="540" y1="0" x2="540" y2="200"/>
    <line x1="585" y1="0" x2="585" y2="200"/>
    <line x1="630" y1="0" x2="630" y2="200"/>
    <line x1="675" y1="0" x2="675" y2="200"/>
    <line x1="720" y1="0" x2="720" y2="200"/>
    <line x1="765" y1="0" x2="765" y2="200"/>
    <line x1="810" y1="0" x2="810" y2="200"/>
    <line x1="855" y1="0" x2="855" y2="200"/>
    <line x1="900" y1="0" x2="900" y2="200"/>
    <line x1="0" y1="0" x2="900" y2="0"/>
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
  </g>
  
  <!-- Glow accent -->
  <rect x="0" y="0" width="900" height="200" fill="url(#glow)" rx="8"/>
  
  <!-- Decorative line -->
  <line x1="80" y1="170" x2="820" y2="170" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
  
  <!-- Terminal cursor block -->
  <rect x="80" y="60" width="2" height="50" fill="#7c3aed" opacity="0.8"/>
  
  <!-- Terminal prompt -->
  <text x="95" y="78" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#7c3aed" opacity="0.9">$</text>
  <text x="115" y="78" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#8b949e">whoami</text>
  
  <!-- Name -->
  <text x="95" y="115" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="38" font-weight="700" fill="url(#text-grad)" letter-spacing="-1">Hillary Ikhais</text>
  
  <!-- Subtitle -->
  <text x="95" y="145" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="15" fill="#8b949e" letter-spacing="0.5">ML Systems Engineer · Building the machinery around models</text>
  
  <!-- Decorative dots -->
  <circle cx="840" cy="70" r="3" fill="#7c3aed" opacity="0.4"/>
  <circle cx="840" cy="85" r="3" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="840" cy="100" r="3" fill="#7c3aed" opacity="0.2"/>
  
  <!-- Terminal output lines -->
  <text x="95" y="168" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e" opacity="0.6">retrieval · ranking · evaluation · agent systems · local inference</text>
</svg>