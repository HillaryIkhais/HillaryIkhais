<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f1520"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#6366f1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#22d3ee;#06b6d4" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="round"><rect width="960" height="240" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="960" height="240" fill="url(#bg)"/>

    <!-- Animated grid dots -->
    <g opacity="0.04" fill="#c9d1d9">
      <circle cx="40" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="200" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle>
      <circle cx="280" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="440" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.0s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="40" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="200" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="280" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="440" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="80" r="1"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" begin="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Terminal window chrome -->
    <rect x="60" y="45" width="520" height="155" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <rect x="60" y="45" width="520" height="32" rx="8" fill="#161b22"/>
    <rect x="60" y="69" width="520" height="1" fill="#21262d"/>
    <!-- Window dots -->
    <circle cx="80" cy="61" r="5" fill="#ff5f57"/>
    <circle cx="98" cy="61" r="5" fill="#febc2e"/>
    <circle cx="116" cy="61" r="5" fill="#28c840"/>
    <!-- Title bar text -->
    <text x="240" y="65" font-family="'SF Mono','Cascadia Code','Fira Code',monospace" font-size="11" fill="#8b949e" text-anchor="middle">hilary ~ </text>

    <!-- Terminal content -->
    <text x="80" y="100" font-family="'SF Mono','Cascadia Code','Fira Code',monospace" font-size="13" fill="#7c3aed" filter="url(#glow)">$</text>
    <text x="96" y="100" font-family="'SF Mono','Cascadia Code','Fira Code',monospace" font-size="13" fill="#c9d1d9">cat focus.txt</text>

    <!-- Typed text with reveal animation -->
    <text x="80" y="128" font-family="'Inter','SF Pro Display',-apple-system,sans-serif" font-size="15" fill="#c9d1d9" opacity="0">
      the retrieval pipeline that decides what the model sees
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/>
    </text>
    <text x="80" y="150" font-family="'Inter','SF Pro Display',-apple-system,sans-serif" font-size="15" fill="#c9d1d9" opacity="0">
      the evaluation framework that proves whether it works
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.8s" fill="freeze"/>
    </text>
    <text x="80" y="172" font-family="'Inter','SF Pro Display',-apple-system,sans-serif" font-size="15" fill="#c9d1d9" opacity="0">
      the engineering that makes it run without a GPU
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.6s" fill="freeze"/>
    </text>

    <!-- Blinking cursor -->
    <rect x="80" y="182" width="8" height="16" fill="#7c3aed" opacity="1">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <!-- Right side: Name and role -->
    <text x="620" y="95" font-family="'Inter','SF Pro Display',-apple-system,sans-serif" font-size="42" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">
      Hillary
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="620" y="135" font-family="'Inter','SF Pro Display',-apple-system,sans-serif" font-size="42" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">
      Ikhais
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" fill="freeze"/>
    </text>

    <!-- Accent line -->
    <rect x="620" y="150" width="0" height="2" fill="url(#accent)" rx="1">
      <animate attributeName="width" from="0" to="120" dur="0.8s" begin="0.8s" fill="freeze"/>
    </rect>

    <!-- Role -->
    <text x="620" y="178" font-family="'Inter','SF Pro Display',-apple-system,sans-serif" font-size="14" fill="#8b949e" letter-spacing="0.5" opacity="0">
      ML Systems Engineer
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
    </text>

    <!-- Focus areas -->
    <text x="620" y="200" font-family="'SF Mono','Cascadia Code','Fira Code',monospace" font-size="11" fill="#6366f1" opacity="0">
      retrieval · ranking · evaluation · agents · local inference
      <animate attributeName="opacity" from="0" to="0.8" dur="0.4s" begin="1.6s" fill="freeze"/>
    </text>
  </g>
</svg>